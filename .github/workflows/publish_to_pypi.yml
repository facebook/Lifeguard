name: Publish to PyPI

on:
  push:
    paths:
      - version.bzl
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build-binaries:
    name: Build binaries
    permissions:
      contents: read
    uses: ./.github/workflows/build_binaries.yml

  publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs:
      - build-binaries
    environment:
      name: pypi
      url: https://pypi.org/p/lifeguard-lazy-imports
    permissions:
      id-token: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List distribution files
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1.13
        with:
          # Idempotent re-runs: skip files already on PyPI (e.g. after a
          # partial upload) rather than failing.
          skip-existing: true

  push-tag:
    name: Push version tag
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] -- tag push needs the persisted credentials v7.0.1
        with:
          fetch-depth: 0
      - name: Get version
        run: |
          VERSION=$(sed -n -e 's/^VERSION = "\(.*\)"/\1/p' version.bzl)
          echo "LIFEGUARD_VERSION=$VERSION" >> $GITHUB_ENV
      - name: Tag commit
        run: git tag "$LIFEGUARD_VERSION"
      - name: Push tag
        run: git push origin tag "$LIFEGUARD_VERSION"
