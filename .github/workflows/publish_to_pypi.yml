name: Publish to PyPI

on:
  push:
    paths:
      - version.bzl
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build-binaries:
    name: Build binaries
    permissions:
      contents: read
    uses: ./.github/workflows/build_binaries.yml

  publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs:
      - build-binaries
    environment:
      name: pypi
      url: https://pypi.org/p/lifeguard-lazy-imports
    permissions:
      id-token: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List distribution files
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1.13
        with:
          # Wheels for 0.1.0 are already on PyPI; skip them so a re-run can
          # upload only newly-added files (e.g. the sdist) instead of 400ing.
          skip-existing: true
          # Print the full server response (e.g. the 400 body) on upload errors.
          verbose: true

  push-tag:
    name: Push version tag
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # zizmor: ignore[artipacked] -- tag push needs the persisted credentials v6.0.2
        with:
          fetch-depth: 0
      - name: Get version
        run: |
          VERSION=$(sed -n -e 's/^VERSION = "\(.*\)"/\1/p' version.bzl)
          echo "LIFEGUARD_VERSION=$VERSION" >> $GITHUB_ENV
      - name: Tag commit
        run: git tag "$LIFEGUARD_VERSION"
      - name: Push tag
        run: git push origin tag "$LIFEGUARD_VERSION"
