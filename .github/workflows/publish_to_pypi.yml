name: Publish to PyPI

on:
  push:
    paths:
      - version.bzl
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the version tag already exists"
        type: boolean
        default: false

permissions: {}

jobs:
  check-publish:
    name: Check whether this version needs publishing
    permissions:
      contents: read
    uses: ./.github/workflows/check_publish.yml
    with:
      # `inputs` is empty on a push event, and passing null to the callee's
      # boolean input is an error.
      force: ${{ inputs.force || false }}

  build-binaries:
    name: Build binaries
    needs: check-publish
    if: needs.check-publish.outputs.should_publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build_binaries.yml

  # build_binaries.yml only smoke-tests the artifact (--version / --help), so
  # without this the release suite is never a precondition for publishing.
  test:
    name: Test
    needs: check-publish
    if: needs.check-publish.outputs.should_publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lifeguard.yml

  publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs:
      - check-publish
      - build-binaries
      - test
    environment:
      name: pypi
      url: https://pypi.org/p/lifeguard-lazy-imports
    permissions:
      id-token: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List distribution files
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1.13
        with:
          # Idempotent re-runs: skip files already on PyPI (e.g. after a
          # partial upload) rather than failing.
          skip-existing: true

  push-tag:
    name: Push version tag
    runs-on: ubuntu-latest
    needs:
      - check-publish
      - publish
    permissions:
      contents: write
    env:
      LIFEGUARD_VERSION: ${{ needs.check-publish.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] -- tag push needs the persisted credentials v7.0.1
        with:
          fetch-depth: 0
      # `git tag` errors on an existing tag, so a forced re-publish of an
      # already-tagged version would fail here after the upload succeeded.
      - name: Tag commit
        run: |
          if git rev-parse -q --verify "refs/tags/$LIFEGUARD_VERSION" >/dev/null; then
            echo "Tag $LIFEGUARD_VERSION already exists; leaving it alone."
          else
            git tag "$LIFEGUARD_VERSION"
            git push origin tag "$LIFEGUARD_VERSION"
          fi
