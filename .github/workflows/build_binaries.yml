name: Build binaries

on:
  push:
    paths:
      - '**/*'
      - '!.*'
      - '.github/workflows/build_binaries.yml'
  workflow_dispatch:
  workflow_call:

permissions: {}

env:
  PACKAGE_FILE_NAME: lifeguard_lazy_imports
  BINARY_NAME: lifeguard
  PYTHON_VERSION: "3.12"

jobs:
  sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly-2026-05-22
          components: clippy, rustfmt
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Test sdist
        run: |
          pip install dist/"${PACKAGE_FILE_NAME}"-*.tar.gz --force-reinstall
          "${BINARY_NAME}" --version
          "${BINARY_NAME}" --help
          python -m lifeguard_lazy_imports --version
      - name: Upload sdist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-sdist
          path: dist

  macos:
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - target: x86_64
            arch: x64
          - target: aarch64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.platform.arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
      - name: Test wheel
        if: ${{ matrix.platform.target == 'aarch64' }}
        run: |
          pip install dist/"${PACKAGE_FILE_NAME}"-*.whl --force-reinstall
          "${BINARY_NAME}" --version
          "${BINARY_NAME}" --help
          python -m lifeguard_lazy_imports --version
      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.platform.arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
      - name: Test wheel
        if: ${{ !startsWith(matrix.platform.target, 'aarch64') }}
        shell: bash
        run: |
          python -m pip install dist/"${PACKAGE_FILE_NAME}"-*.whl --force-reinstall
          "${BINARY_NAME}" --version
          "${BINARY_NAME}" --help
          python -m lifeguard_lazy_imports --version
      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - name: Test wheel
        if: ${{ startsWith(matrix.target, 'x86_64') }}
        run: |
          pip install dist/"${PACKAGE_FILE_NAME}"-*.whl --force-reinstall
          "${BINARY_NAME}" --version
          "${BINARY_NAME}" --help
          python -m lifeguard_lazy_imports --version
      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  test:
    name: Test with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs:
      - linux
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test wheel
        run: |
          pip install dist/"${PACKAGE_FILE_NAME}"-*.whl --force-reinstall
          "${BINARY_NAME}" --version
          "${BINARY_NAME}" --help
          python -m lifeguard_lazy_imports --version

  merge:
    name: Merge artifacts
    runs-on: ubuntu-latest
    needs:
      - sdist
      - macos
      - windows
      - linux
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
